<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Masotto Terrace — Finanze</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06151a}iframe{display:block;border:0;width:100%;height:100vh}</style>
</head>
<body>
  <iframe id="financeApp" src="finanze_base.html?v=20260823-v69" title="Finanze Masotto Terrace"></iframe>
  <script>
    (function(){
      var frame=document.getElementById('financeApp');
      frame.addEventListener('load',function(){
        try{
          var w=frame.contentWindow, d=frame.contentDocument;
          var s=d.createElement('script');
          s.src='finance_v69_patch.js?v=20260823-v69';
          d.head.appendChild(s);
          d.querySelectorAll('a[href]').forEach(function(a){
            a.addEventListener('click',function(e){
              var href=a.getAttribute('href')||'';
              if(!href||href.charAt(0)==='#'||href.indexOf('javascript:')===0)return;
              if(/\.html(?:[?#].*)?$/i.test(href)){
                e.preventDefault();
                window.top.location.href=href.toLowerCase().indexOf('finanze_base.html')>=0?'finanze.html':href;
              }
            });
          });
        }catch(err){ console.error('Finance wrapper V69',err); }
      });
    })();
  </script>
</body>
</html>
